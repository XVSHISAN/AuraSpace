<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>静界 AuraSpace · 空间白噪音 &amp; 脑波混音工坊</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b1328'/%3E%3Ccircle cx='32' cy='32' r='20' fill='none' stroke='%236ea8fe' stroke-width='3' opacity='0.6'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%236ea8fe'/%3E%3C/svg%3E" />
  <script src="https://s1.hdslb.com/bfs/seed/toy/app/sdk/toy-sdk.js"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="sceneCanvas" class="scene-canvas"></canvas>
  <div class="vignette"></div>

  <div id="appShell" class="app-shell">
    <header class="top-bar ui-chrome">
      <div class="brand-group">
        <span class="brand-dot"></span>
        <div class="brand-titles">
          <div class="brand-name">静界 · AuraSpace</div>
          <div id="brandSub" class="brand-sub">雨夜归窗 · 10 Hz α</div>
        </div>
      </div>

      <div class="top-actions">
        <button type="button" id="breathBtn" class="pill-btn" title="呼吸引导" aria-label="呼吸引导">
          <span id="breathBtnLabel">呼吸</span>
        </button>
        <button type="button" id="immersiveBtn" class="icon-btn" title="沉浸模式" aria-label="沉浸模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button type="button" id="shareBtn" class="pill-btn" aria-label="生成配方海报">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M8 14l3-3 4 4 3-3" />
          </svg>
          <span>配方卡</span>
        </button>
        <button type="button" id="proBtn" class="pill-btn pro-cta" hidden>
          <span id="proBtnLabel">解锁 Pro ￥6/月</span>
        </button>
      </div>
    </header>

    <div id="trialBanner" class="trial-banner ui-chrome" hidden>
      <span id="trialText">Pro 空间试听中...</span>
      <button type="button" id="trialUnlockBtn" class="trial-cta">立即解锁</button>
    </div>

    <main class="center-stage ui-chrome">
      <div id="statusChip" class="status-chip">
        <strong>雨夜归窗</strong><span>·</span><span>10 Hz α</span>
      </div>

      <div id="breathCue" class="breath-cue" hidden>缓缓吸气 · 4s</div>

      <div id="playOrbit" class="play-orbit">
        <div class="play-ring"></div>
        <svg class="timer-ring-svg" viewBox="0 0 132 132" aria-hidden="true">
          <circle class="timer-ring-bg" cx="66" cy="66" r="63" />
          <circle id="timerRingArc" class="timer-ring-arc" cx="66" cy="66" r="63" />
        </svg>
        <button type="button" id="playBtn" class="play-btn" aria-label="播放或暂停声音">
          <span id="playIcon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5-11-6.5z"/></svg>
          </span>
          <span id="playLabel" class="play-btn-label">开启声景</span>
        </button>
      </div>

      <button type="button" id="timerReadout" class="timer-readout is-idle" title="打开专注与睡眠定时">点按下方「定时」开启专注 / 睡眠渐弱</button>
      <div id="quickMeta" class="quick-meta"></div>
    </main>

    <footer class="bottom-dock ui-chrome">
      <div id="presetStrip" class="preset-strip"></div>

      <nav id="dockBar" class="dock-bar" aria-label="功能切换">
        <button type="button" class="dock-item" data-sheet="mixer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
          <span>混音</span>
        </button>
        <button type="button" class="dock-item" data-sheet="scenes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
          <span>场景</span>
        </button>
        <button type="button" class="dock-item" data-sheet="brainwave">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 12h3l2-6 4 12 3-8 2 4h6"/>
          </svg>
          <span>脑波</span>
        </button>
        <button type="button" class="dock-item" data-sheet="timer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="13" r="8"/>
            <path d="M12 9v4l2.5 2.5M9 2h6"/>
          </svg>
          <span>定时</span>
        </button>
        <button type="button" class="dock-item" data-sheet="recipes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span>配方</span>
        </button>
      </nav>
    </footer>
  </div>

  <div id="immersiveClock" class="immersive-clock" aria-hidden="true">
    <div id="immersiveBreath" class="immersive-breath" hidden>
      <div id="immersiveBreathPhase" class="immersive-breath-phase">缓缓吸气</div>
      <div id="immersiveBreathSec" class="immersive-breath-sec">4s</div>
      <div id="immersiveBreathMode" class="immersive-breath-mode">4-4-4-4 盒式专注呼吸</div>
    </div>
    <div id="immersiveClockTime" class="immersive-clock-time">00:00</div>
    <div id="immersiveClockSub" class="immersive-clock-sub">雨夜归窗</div>
  </div>
  <div class="immersive-hint">轻触屏幕任意位置恢复控制台</div>

  <div id="sheetBackdrop" class="sheet-backdrop" hidden>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <div id="sheetTitle" class="sheet-title">控制台</div>
        <button type="button" id="sheetCloseBtn" class="sheet-close" aria-label="关闭面板">✕</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <button type="button" id="devPreviewPill" class="dev-preview-pill" hidden></button>

  <script type="module" src="./app.js"></script>
</body>
</html>
